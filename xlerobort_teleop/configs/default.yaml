# XLeRobot Dual-Arm Teleoperation — Default Configuration

devices:
  leader_right:   /dev/leader_right
  leader_left:    ~                   # null = not connected (single-leader modes)
  follower_right: /dev/follower_right
  follower_left:  /dev/follower_left

# Arm IDs used for calibration file naming (lerobot saves to ~/.lerobot/<id>.json)
calibration_ids:
  leader_right:   test_leader_right
  leader_left:    test_leader_left
  follower_right: test_follower_right
  follower_left:  test_follower_left

control:
  fps:      50
  baudrate: 1000000

logging:
  level: INFO
  log_file: logs/teleop.log
